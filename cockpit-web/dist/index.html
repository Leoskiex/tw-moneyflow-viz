<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b0f14" />
  <title>Kansoku TW · 駕駛艙</title>
  <style>
    :root {
      --bg: #0b0f14; --surface: #121821; --surface2: #18202b;
      --border: #243041; --borderStrong: #2f3f55;
      --text: #e8eef7; --text2: #aab7c9; --muted: #8b9bb0;
      --accent: #38bdf8; --ok: #22c55e; --down: #f87171; --warn: #ffc107;
      --radius: 8px;
    }
    * { box-sizing: border-box; }
    html, body, #root { height: 100%; }
    body { margin: 0; background: var(--bg); color: var(--text);
      font-family: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
      font-size: 14px; }
    a { color: var(--accent); text-decoration: none; }
    button { font: inherit; cursor: pointer; }
    input { font: inherit; }

    .app-root { display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
    .titlebar {
      flex: 0 0 40px; height: 40px; display: flex; align-items: center; gap: 8px;
      padding: 0 12px; background: var(--surface); border-bottom: 1px solid var(--border);
      position: relative; z-index: 80;
    }
    .brand { font-weight: 700; font-size: 13px; letter-spacing: .02em; color: var(--text); margin-right: 6px; }
    .tabstrip { display: flex; gap: 2px; flex: 1; min-width: 0; }
    .tab {
      padding: 4px 12px; border-radius: var(--radius); color: var(--text2); font-size: 13px;
    }
    .tab:hover { color: var(--text); background: var(--surface2); }
    .tab.active { color: var(--text); background: var(--surface2); box-shadow: inset 0 0 0 1px var(--border); }
    .titlebar-right { display: flex; align-items: center; gap: 10px; }
    .tpe { font-family: ui-monospace, Menlo, monospace; font-size: 11px; color: var(--muted); }
    .app-content { flex: 1; min-height: 0; overflow: auto; }
    .page { padding: 16px 20px 40px; }
    .page.narrow { max-width: 980px; margin: 0 auto; }

    .card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; }
    .card h3 { margin: 0; padding: 9px 12px; font-size: 12px; color: var(--accent); border-bottom: 1px solid var(--border); }
    .muted { color: var(--muted); font-size: 12px; }
    .err { color: var(--down); font-size: 12px; padding: 10px 12px; }
    .pill { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--border); border-radius: 999px;
      padding: 2px 10px; font-size: 12px; background: var(--surface); color: var(--text2); }
    .up { color: var(--down); } .dn { color: var(--ok); }  /* TW convention: 紅漲綠跌 */
    .pass { color: var(--ok); } .fail { color: var(--down); } .unknown { color: var(--warn); }

    .btn { background: var(--surface2); color: var(--text); border: 1px solid var(--border); border-radius: var(--radius);
      padding: 4px 10px; font-size: 12px; }
    .btn:hover { border-color: var(--borderStrong); }
    .btn.primary { background: #12243a; color: var(--accent); }
    .btn:disabled { opacity: .5; cursor: default; }
  </style>
  <script type="module" crossorigin src="/assets/index-cWmppTck.js"></script>
  <link rel="stylesheet" crossorigin href="/assets/index-DrgXK0p0.css">
</head>
<body>
  <div id="root"></div>
</body>
</html>
